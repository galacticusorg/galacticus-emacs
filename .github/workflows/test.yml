name: 'test'
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'
      - name: Run tests
        run: |
          emacs -Q --batch -L . -l galacticus-docs-tests.el \
                -f ert-run-tests-batch-and-exit
